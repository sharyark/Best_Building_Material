[project]
name = "hisaab-backend"
version = "0.1.0"
description = "Construction Material Supply - Digital Hisaab Portal (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "openpyxl>=3.1",
    "weasyprint>=62",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Migrations are generated; the local alembic/ folder must not shadow the alembic package for import sorting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
